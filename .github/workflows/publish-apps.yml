name: Publish bh and bhtui

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          submodules: recursive

      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Build and check bhtui against Kali ARM libraries
        run: |
          docker run --rm --platform linux/arm/v7 \
            --volume "$GITHUB_WORKSPACE:/src" --workdir /src \
            --env DEBIAN_FRONTEND=noninteractive \
            kalilinux/kali-rolling:latest bash -euo pipefail -c '
              test "$(dpkg --print-architecture)" = armhf
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential cmake git ca-certificates libicu-dev

              cmake -S package/bhtui -B package/bhtui/build \
                -DCMAKE_BUILD_TYPE=Release
              cmake --build package/bhtui/build --target bhtui --parallel 2

              ldd package/bhtui/build/bhtui
              # An unsupported option prints usage and exits 2 without opening the TUI.
              package/bhtui/build/bhtui --help || test "$?" -eq 2
            '

      - name: Package bh and bhtui
        run: |
          mkdir -p dist/apps dist/bh/scripts dist/bhtui

          install -m 0755 package/blackhat/src/blackhat.sh dist/bh/bh
          install -m 0755 package/blackhat/src/evil_portal.py dist/bh/
          install -m 0644 package/blackhat/src/telegram.py dist/bh/
          install -m 0644 package/blackhat/src/blackhat.conf dist/bh/
          cp -a package/blackhat/scripts/. dist/bh/scripts/
          printf '%s\n' Flask requests PyWiFi > dist/bh/requirements.txt

          install -m 0755 package/bhtui/build/bhtui dist/bhtui/

          tar -C dist -czf dist/apps/bh.tar.gz bh
          tar -C dist -czf dist/apps/bhtui-linux-armhf.tar.gz bhtui
          rm -rf dist/bh dist/bhtui

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
