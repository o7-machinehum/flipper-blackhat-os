name: Publish bh and bhtui

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          submodules: recursive

      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Build and check bhtui against Kali ARM libraries
        run: ./scripts/build-bhtui.sh

      - name: Package bh and bhtui
        run: |
          mkdir -p dist/apps dist/bh/scripts dist/bhtui

          install -m 0755 package/blackhat/src/blackhat.sh dist/bh/bh
          install -m 0755 package/blackhat/src/evil_portal.py dist/bh/
          install -m 0644 package/blackhat/src/telegram.py dist/bh/
          install -m 0644 package/blackhat/src/blackhat.conf dist/bh/
          cp -a package/blackhat/scripts/. dist/bh/scripts/
          printf '%s\n' Flask requests PyWiFi > dist/bh/requirements.txt

          install -m 0755 package/bhtui/build/bhtui dist/bhtui/

          tar -C dist -czf dist/apps/bh.tar.gz bh
          tar -C dist -czf dist/apps/bhtui-linux-armhf.tar.gz bhtui
          rm -rf dist/bh dist/bhtui

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
